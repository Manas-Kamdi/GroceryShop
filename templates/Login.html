{% extends 'base.html' %}
{% load static %}

{% block title %}Login - GroceryShop{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="section-subtitle">Login to access your dashboard, orders, and cart</p>
        </div>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" id="password" name="password" required>
            </div>
            
            <button class="btn btn-primary mt-2" type="submit" style="width: 100%;">
                Sign In <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>
        
        <div class="auth-redirect">
            <span>Don't have an account?</span>
            <a href="{% url 'signup' %}">Sign up today</a>
        </div>
    </div>
</div>
{% endblock %}
