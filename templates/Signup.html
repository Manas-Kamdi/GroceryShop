{% extends 'base.html' %}
{% load static %}

{% block title %}Register Account - GroceryShop{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Create Account</h1>
            <p class="section-subtitle">Register to unlock fast checkout and order tracking</p>
        </div>

        <form method="post" action="{% url 'signup' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Enter Full Name"
                    value="{{ request.POST.name|default_if_none:'' }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter Email Address"
                    value="{{ request.POST.email|default_if_none:'' }}" required>
            </div>

            <div class="form-group">
                <label for="number">Phone Number</label>
                <input type="tel" id="number" name="number" class="form-control" placeholder="Enter Phone Number"
                    value="{{ request.POST.number|default_if_none:'' }}" pattern="[0-9]{10}" title="Enter 10 digit phone number"
                    required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" class="form-control" placeholder="Enter Your Address"
                    value="{{ request.POST.address|default_if_none:'' }}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>

            <div class="form-group">
                <label for="c-password">Confirm Password</label>
                <input type="password" id="c-password" name="c-password" class="form-control" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn btn-primary mt-2" style="width: 100%;">
                Create Account <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <div class="auth-redirect">
            <span>Already have an account?</span>
            <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</div>

<!-- SweetAlert Library -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% if messages %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        {% for message in messages %}
        Swal.fire({
            icon: "{% if message.tags == 'error' %}error{% else %}success{% endif %}",
            title: "{{ message }}",
            confirmButtonColor: "#14b8a6"
        });
        {% endfor %}
    });
</script>
{% endif %}
{% endblock %}
